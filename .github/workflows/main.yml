name: Unpack Project ZIP

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Unzip Project Files
        run: |
          unzip -o miband5-companion-phase3-fixed-with-cibuild.zip
          rm miband5-companion-phase3-fixed-with-cibuild.zip

      - name: Commit & Push Extracted Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto-extracted project files from ZIP"
          git push
          
